# Full-reward GRPO configuration. Run from the HERA-VLM root.
data:
  train_files: data/rl/train.parquet
  val_files: data/rl/valid.parquet
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0

  # Document pages at 1700x2200 can create many visual tokens.
  # Start conservatively, then increase if memory permits.
  max_prompt_length: 8192
  max_response_length: 1024
  rollout_batch_size: 2
  mini_rollout_batch_size: null
  val_batch_size: 1
  format_prompt: prompts/conreg_grounding.jinja
  override_chat_template: null
  shuffle: true
  seed: 42
  min_pixels: 262144
  max_pixels: 12845056
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 1

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 4.09

worker:
  actor:
    global_batch_size: 2
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: false
    dynamic_batching: true
    ulysses_size: 1

    model:
      model_path: checkpoints/hera-vlm-sft-merged
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
      lora:
        rank: 8
        alpha: 16
        target_modules: all-linear
        exclude_modules: .*visual.*

    optim:
      lr: 5.0e-5
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.03

    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      use_orig_params: false

    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    n: 4
    temperature: 0.9
    top_p: 0.95
    limit_images: 2
    gpu_memory_utilization: 0.5
    enforce_eager: false
    enable_chunked_prefill: true
    tensor_parallel_size: 1
    max_num_batched_tokens: 12000
    max_model_len: 12000
    disable_tqdm: false
    val_override_config:
      temperature: 0.2
      top_p: 0.9
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false
    padding_free: false

  reward:
    reward_function: reward_functions/conreg_four_aspect_reward_colqwen2_stepwise_with_order.py:compute_score
    reward_function_kwargs:
      answer_weight: 1.0
      grounding_weight: 1.0
      stepwise_weight: 1.0
      format_weight: 1.0
      require_valid_weight_sum: false
      pred_coordinate_space: "pixel"
      gold_coordinate_space: "pixel"
      allow_missing_image_index: true
      grounding_hybrid_iou_weight: 0.9
      grounding_extra_bonus_weight: 0.1
      grounding_iou_low_threshold: 0.1
      grounding_iou_high_threshold: 0.5
      grounding_coverage_threshold: 0.95
      grounding_coverage_max_area_ratio: 1.25
      grounding_merged_iou_threshold: 0.5
      grounding_merge_max_gap: 0.02
      answer_exact_weight: 0.1
      answer_token_f1_weight: 0.1
      answer_semantic_weight: 0.8
      semantic_backend: "sentence_transformers"
      semantic_model_name_or_path: "sentence-transformers/all-MiniLM-L6-v2"
      semantic_device: "cpu"
      semantic_local_files_only: false
      step_similarity_threshold: 0.5
      step_accuracy_gate_threshold: 0.6
      step_validity_weight: 0.4
      path_order_weight: 0.6
      colqwen2_model_name_or_path: "vidore/colqwen2-v1.0-hf"
      colqwen2_device: "cuda"
      colqwen2_dtype: "bfloat16"
      colqwen2_load_in_4bit: false
      colqwen2_batch_size: 4

trainer:
  total_epochs: 1
  max_steps: null
  project_name: hera_vlm
  experiment_name: hera_vlm_full_reward
  logger: ["file"]
  nnodes: 1
  n_gpus_per_node: 1
  max_try_make_batch: 20
  val_freq: 10
  val_before_train: true
  val_only: false
  val_generations_to_log: 5
  save_freq: 50
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: checkpoints/hera-vlm-rl
  find_last_checkpoint: false
